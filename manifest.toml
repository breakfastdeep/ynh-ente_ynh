[general]
id = "ente"
packaging_format = 2
name.en = "Ente"
description.en = "End-to-end encrypted photo storage"
version = "0.14.0~ynh2"
license = "AGPL-3.0-only"
maintainer.name = "Ente Team"
maintainer.email = "support@ente.io"
url = "https://ente.io"

[requirements]
yunohost = ">= 11.8.4"
ram.runtime = 2048  # 2GB RAM
disk = 20480  # 20GB
architecture = "amd64"  # Go derlemesi için

[services]
nginx.allowed_domains = ["DOMAIN"]
postgresql.database = "ente"
postgresql.user = "ente_user"

[arguments.install]
domain = { type = "domain", ask.en = "Installation domain" }
admin_email = { type = "string", ask.en = "Admin email" }