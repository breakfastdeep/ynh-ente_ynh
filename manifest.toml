# :#schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "entephotos"
name = "Ente Photos (Standalone)"
version = "0.1~ynh1"
license = "AGPL-3.0-or-later"
url = "https://github.com/ente-io/ente"
description.en = "Stand‐alone Ente self-hosted encrypted photo backup and sharing server"
description.tr = "Docker’sız, kendi kendine barındırılan şifreli fotoğraf yedekleme ve paylaşım sunucusu"

maintainers = ["breakfastdeep"]

[integration]
yunohost = ">= 12.0"
helpers_version = "2.14"
architectures = "all"
multi_instance = false
ldap = true
sso = false
disk = "1G"
ram.build = "500M"
ram.runtime = "500M"

[install]
# Burada exec (veya script) doğrudan tanımlanmalı, alt tabloların dışına:
exec = "scripts/install"

# Aşağıdakiler inline atamalar (sorular) olarak tanımlanıyor:
domain.type = "domain"
path.type = "path"
path.default = "/entephotos"
admin.type = "user"
password.type = "password"
password.help.en = "Password for the Ente Photos admin user"
password.help.tr = "Ente Photos yönetici kullanıcısı şifresi"

[resources]
  [resources.system_user]
  name = "entephotos"

  [resources.install_dir]
  path = "/var/www/entephotos"

  [resources.data_dir]
  path = "/home/yunohost.app/entephotos"

  [resources.permissions]
  main.url = "/entephotos"

  [resources.apt]
  packages = "git golang-go build-essential pkg-config nodejs npm libsodium-dev mysql-server"

  [resources.database]
  type = "mysql"
